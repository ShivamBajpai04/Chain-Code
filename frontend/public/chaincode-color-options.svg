<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1040" height="1300" viewBox="0 0 1040 1300" role="img" aria-labelledby="title desc">
  <title id="title">ChainCode color options</title>
  <desc id="desc">Eight two-color palettes applied to the selected mirrored interlocking-C mark, including 32 pixel favicon previews.</desc>
  <defs>
    <!-- Each matrix maps black to the mark color and white to the background color. -->
    <filter id="p1" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="-.752942 0 0 0 .831373  0 -.564706 0 0 .627451  0 0 .090196 0 .090196  0 0 0 1 0"/></filter>
    <filter id="p2" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="-.090196 0 0 0 .133333  0 -.764706 0 0 .827451  0 0 -.807843 0 .933333  0 0 0 1 0"/></filter>
    <filter id="p3" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="-.654902 0 0 0 .717647  0 -.878431 0 0 .952941  0 0 -.239216 0 .290196  0 0 0 1 0"/></filter>
    <filter id="p4" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="-.870588 0 0 0 1  0 -.356863 0 0 .419608  0 0 -.184313 0 .368627  0 0 0 1 0"/></filter>
    <filter id="p5" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="-.411765 0 0 0 .474510  0 -.674510 0 0 .780392  0 0 -.760784 0 1  0 0 0 1 0"/></filter>
    <filter id="p6" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="-.352941 0 0 0 .411765  0 -.749020 0 0 .890196  0 0 -.588236 0 .701961  0 0 0 1 0"/></filter>
    <filter id="p7" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="-.870588 0 0 0 .960784  0 -.635294 0 0 .725490  0 0 -.168628 0 .258824  0 0 0 1 0"/></filter>
    <filter id="p8" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values=".882353 0 0 0 .078431  0 .882353 0 0 .062745  0 0 .729412 0 .180392  0 0 0 1 0"/></filter>
    <style>
      .kicker { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: .18em; }
      .heading { font: 700 31px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: -.025em; }
      .subtitle { font: 450 15px Inter, ui-sans-serif, system-ui, sans-serif; }
      .number { font: 800 15px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: .1em; }
      .name { font: 700 21px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: -.015em; }
      .hex { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .02em; }
      .wordmark { font: 800 17px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: .11em; }
      .micro { font: 700 10px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: .08em; }
    </style>
  </defs>

  <rect width="1040" height="1300" fill="#080A12"/>
  <text x="40" y="39" class="kicker" fill="#D4A017">CHAINCODE</text>
  <text x="40" y="78" class="heading" fill="#F5F1E8">Choose the color system</text>
  <text x="40" y="103" class="subtitle" fill="#9298AA">Selected mark · two colors per option · 32px favicon check included</text>

  <!-- 01 — original brief -->
  <g transform="translate(40 126)">
    <rect width="468" height="270" rx="28" fill="#14102E"/>
    <text x="24" y="34" class="number" fill="#D4A017">01</text>
    <text x="66" y="34" class="name" fill="#D4A017">Royal Gold</text>
    <image x="20" y="51" width="168" height="168" href="logo-colorways/selected-mark-source.png" filter="url(#p1)"/>
    <text x="207" y="108" class="wordmark" fill="#D4A017">CHAINCODE</text>
    <text x="207" y="138" class="hex" fill="#D4A017">#14102E  /  #D4A017</text>
    <rect x="207" y="169" width="64" height="64" rx="15" fill="#14102E" stroke="#D4A017" stroke-width="1"/>
    <image x="223" y="185" width="32" height="32" href="logo-colorways/selected-mark-source.png" filter="url(#p1)"/>
    <text x="285" y="196" class="micro" fill="#D4A017">FAVICON</text>
    <text x="285" y="215" class="hex" fill="#D4A017">32 × 32</text>
  </g>

